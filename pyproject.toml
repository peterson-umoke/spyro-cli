[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spyro-cli"
version = "0.6.0"
description = "Intelligent SSH tunneling & remote command CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Peterson Umoke Nwachukwu"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pip-audit>=2.6",
]
watch = [
    "watchdog>=3.0",
]

[project.scripts]
spyro = "spyro.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
spyro = "src/spyro"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

name: release-draft

# Runs when a release/vX.Y.Z PR is merged (not on every push): creates a DRAFT
# release with the PR body as notes. Nothing reaches users and no tag exists until
# you click Publish on the draft; publishing creates vX.Y.Z at the merge commit.
# `spyro update` only follows published releases, never bare tags.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  draft:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Draft release
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/spyro/__init__.py)
          [ "release/v$v" = "$HEAD_REF" ] && [ "$v" = "$init" ] || { echo "version mismatch: branch=$HEAD_REF pyproject=$v __init__=$init"; exit 1; }
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
          gh release create "v$v" --draft --target "$SHA" --latest --title "v$v" --notes-file "$RUNNER_TEMP/notes.md"

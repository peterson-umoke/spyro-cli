name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run python -m pytest -q
      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt > runtime-requirements.txt
          uv run pip-audit -r runtime-requirements.txt --no-deps --disable-pip
